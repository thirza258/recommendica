services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DEBUG: "${DEBUG:-False}"
      DEVELOPMENT_MODE: "${DEVELOPMENT_MODE:-False}"
      SECRET_KEY: "${SECRET_KEY:-your-secret-key}"
      DB_NAME: "${DB_NAME:-ragdb}"
      DB_USER: "${DB_USER:-raguser}"
      DB_PASSWORD: "${DB_PASSWORD:-ragpassword}"
      DB_HOST: "${DB_HOST:-db}"
      DB_PORT: "${DB_PORT:-5432}"
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend,0.0.0.0}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:5173}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENROUTER_BASE_URL: "${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      DEFAULT_LLM_MODEL: "${DEFAULT_LLM_MODEL:-google/gemma-4-26b-a4b-it}"
      LANGSMITH_TRACING: "${LANGSMITH_TRACING:-True}"
      LANGSMITH_ENDPOINT: "${LANGSMITH_ENDPOINT:-}"
      LANGSMITH_API_KEY: "${LANGSMITH_API_KEY:-}"
      LANGSMITH_PROJECT: "${LANGSMITH_PROJECT:-}"
      # NOTE: this compose file does not define a `chromadb` service — point
      # RE_CHROMA_HOST/PORT at wherever your indexed collection actually lives.
      # If Chroma is unreachable the API now answers 503 with a clear reason
      # (see GET /api/v1/health/ready/) instead of silently returning no results.
      RE_CHROMA_HOST: "${RE_CHROMA_HOST:-chromadb}"
      RE_CHROMA_PORT: "${RE_CHROMA_PORT:-8000}"
      CHROMA_ALLOW_EPHEMERAL_FALLBACK: "${CHROMA_ALLOW_EPHEMERAL_FALLBACK:-False}"
      OLLAMA_EMBEDDING_MODEL: "${OLLAMA_EMBEDDING_MODEL:-embeddinggemma}"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://host.docker.internal:11434}"
      EMBEDDING_MODEL: "${EMBEDDING_MODEL:-embeddinggemma}"
      EMBEDDING_BATCH_SIZE: "${EMBEDDING_BATCH_SIZE:-100}"
      EMBEDDING_TIMEOUT: "${EMBEDDING_TIMEOUT:-60}"
      DENSE_LLM_MODEL: "${DENSE_LLM_MODEL:-google/gemma-4-26b-a4b-it}"
      LLM_TEMPERATURE: "${LLM_TEMPERATURE:-0}"
      LLM_REQUEST_TIMEOUT: "${LLM_REQUEST_TIMEOUT:-120}"
      LLM_TRANSFORM_TIMEOUT: "${LLM_TRANSFORM_TIMEOUT:-30}"
      LLM_MAX_RETRIES: "${LLM_MAX_RETRIES:-2}"
      LLM_CACHE_TTL: "${LLM_CACHE_TTL:-900}"
      TOP_K: "${TOP_K:-5}"
      CANDIDATE_MULTIPLIER: "${CANDIDATE_MULTIPLIER:-4}"
      CHUNK_SIZE: "${CHUNK_SIZE:-5}"
      COLLECTION_NAME: "${COLLECTION_NAME:-arxiv_collection}"
      ENABLE_HYDE: "${ENABLE_HYDE:-True}"
      ENABLE_STEP_BACK: "${ENABLE_STEP_BACK:-True}"
      ENABLE_RAG_FUSION: "${ENABLE_RAG_FUSION:-True}"
      VARIANT_STAGE_TIMEOUT: "${VARIANT_STAGE_TIMEOUT:-45}"
      RRF_K: "${RRF_K:-60}"
      MAX_CONTEXT_DOCS: "${MAX_CONTEXT_DOCS:-12}"
      MAX_DOC_CHARS_IN_PROMPT: "${MAX_DOC_CHARS_IN_PROMPT:-1500}"
      GENERATION_MAX_WORKERS: "${GENERATION_MAX_WORKERS:-3}"
      # Relevance agent: grades retrieved papers, drops unrelated ones, and
      # retries with a refined query when too few are related.
      ENABLE_RELEVANCE_AGENT: "${ENABLE_RELEVANCE_AGENT:-True}"
      AGENT_MODEL: "${AGENT_MODEL:-}"
      AGENT_TIMEOUT: "${AGENT_TIMEOUT:-30}"
      AGENT_MAX_ITERATIONS: "${AGENT_MAX_ITERATIONS:-2}"
      AGENT_MIN_RELEVANT_DOCS: "${AGENT_MIN_RELEVANT_DOCS:-3}"
      AGENT_GRADE_CANDIDATES: "${AGENT_GRADE_CANDIDATES:-20}"
      AGENT_RELEVANCE_THRESHOLD: "${AGENT_RELEVANCE_THRESHOLD:-0.5}"
      AGENT_DEADLINE: "${AGENT_DEADLINE:-90}"
      ENABLE_ANSWER_EVALUATION: "${ENABLE_ANSWER_EVALUATION:-False}"
      ANSWER_EVALUATION_TIMEOUT: "${ANSWER_EVALUATION_TIMEOUT:-45}"
      # Live arXiv fallback: consulted when the collection cannot supply
      # AGENT_MIN_RELEVANT_DOCS related papers, graded like local results, and
      # skipped without complaint when arxiv.org is unreachable.
      ENABLE_ARXIV_FALLBACK: "${ENABLE_ARXIV_FALLBACK:-True}"
      ARXIV_API_URL: "${ARXIV_API_URL:-https://export.arxiv.org/api/query}"
      ARXIV_FALLBACK_MAX_RESULTS: "${ARXIV_FALLBACK_MAX_RESULTS:-10}"
      ARXIV_FALLBACK_TIMEOUT: "${ARXIV_FALLBACK_TIMEOUT:-15}"
      ARXIV_MIN_REQUEST_INTERVAL: "${ARXIV_MIN_REQUEST_INTERVAL:-3}"
      ARXIV_USER_AGENT: "${ARXIV_USER_AGENT:-}"
      ARXIV_MAX_QUERY_TERMS: "${ARXIV_MAX_QUERY_TERMS:-6}"
      ARXIV_SORT_BY: "${ARXIV_SORT_BY:-relevance}"
      ARXIV_BREAKER_THRESHOLD: "${ARXIV_BREAKER_THRESHOLD:-3}"
      ARXIV_BREAKER_COOLDOWN: "${ARXIV_BREAKER_COOLDOWN:-300}"
      # Boundary checks: screen the query before spending on it, and report
      # what the answer is built from afterwards.
      ENABLE_QUERY_VERIFICATION: "${ENABLE_QUERY_VERIFICATION:-True}"
      QUERY_VERIFICATION_TIMEOUT: "${QUERY_VERIFICATION_TIMEOUT:-15}"
      QUERY_MIN_CHARS: "${QUERY_MIN_CHARS:-2}"
      QUERY_MAX_CHARS: "${QUERY_MAX_CHARS:-1000}"
      ENABLE_RESULT_VERIFICATION: "${ENABLE_RESULT_VERIFICATION:-True}"
      MAX_CONCURRENT_QUERIES: "${MAX_CONCURRENT_QUERIES:-8}"
      SSE_HEARTBEAT_SECONDS: "${SSE_HEARTBEAT_SECONDS:-15}"
      GUNICORN_WORKERS: "${GUNICORN_WORKERS:-2}"
      GUNICORN_THREADS: "${GUNICORN_THREADS:-8}"
      GUNICORN_TIMEOUT: "${GUNICORN_TIMEOUT:-900}"
      RERANK_MODEL: "${RERANK_MODEL:-}"
      RERANK_TOP_N: "${RERANK_TOP_N:-}"
      RERANK_TIMEOUT: "${RERANK_TIMEOUT:-15}"
      HYDE_MODEL: "${HYDE_MODEL:-mistralai/mistral-nemo}"
      STEP_BACK_MODEL: "${STEP_BACK_MODEL:-mistralai/mistral-nemo}"
      RAG_FUSION_MODEL: "${RAG_FUSION_MODEL:-mistralai/mistral-nemo}"
      RAG_FUSION_N_VARIANTS: "${RAG_FUSION_N_VARIANTS:-4}"
      CONFIDENCE_ALPHA: "${CONFIDENCE_ALPHA:-0.5}"
      CONFIDENCE_BETA: "${CONFIDENCE_BETA:-0.3}"
      CONFIDENCE_GAMMA: "${CONFIDENCE_GAMMA:-0.2}"
      CONFIDENCE_THRESHOLD: "${CONFIDENCE_THRESHOLD:-0.75}"
      # Donations (Paddle). Leave the credentials empty to keep the feature
      # off: the API then reports it as disabled and the UI hides the button.
      PADDLE_ENVIRONMENT: "${PADDLE_ENVIRONMENT:-sandbox}"
      PADDLE_API_KEY: "${PADDLE_API_KEY:-}"
      PADDLE_CLIENT_TOKEN: "${PADDLE_CLIENT_TOKEN:-}"
      PADDLE_WEBHOOK_SECRET: "${PADDLE_WEBHOOK_SECRET:-}"
      PADDLE_DONATION_PRODUCT_ID: "${PADDLE_DONATION_PRODUCT_ID:-}"
      PADDLE_DONATION_CURRENCIES: "${PADDLE_DONATION_CURRENCIES:-USD,EUR,GBP}"
      PADDLE_DONATION_PRESETS: "${PADDLE_DONATION_PRESETS:-5,15,50}"
      PADDLE_DONATION_MIN_AMOUNT: "${PADDLE_DONATION_MIN_AMOUNT:-1}"
      PADDLE_DONATION_MAX_AMOUNT: "${PADDLE_DONATION_MAX_AMOUNT:-1000}"
      PADDLE_WEBHOOK_TOLERANCE: "${PADDLE_WEBHOOK_TOLERANCE:-300}"
      DONATION_THROTTLE_RATE: "${DONATION_THROTTLE_RATE:-20/hour}"
      NUM_PROXIES: "${NUM_PROXIES:-1}"
    ports:
      - "8056:8000"
    volumes:
      - .:/app
      - backend_static:/app/staticfiles
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Liveness only — deliberately does not depend on Chroma/Ollama/OpenRouter,
    # so a dependency outage does not trigger a restart loop of a healthy app.
    healthcheck:
      test:
        - "CMD-SHELL"
        - "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/', timeout=5).status == 200 else 1)\""
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: "${DB_NAME:-ragdb}"
      POSTGRES_USER: "${DB_USER:-raguser}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-ragpassword}"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-raguser}"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped 
    depends_on:
      - backend
    ports:
      - "5156:80"

volumes:
  backend_static:
  postgres_data:
