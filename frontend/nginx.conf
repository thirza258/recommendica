server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # ── Transfer size ──────────────────────────────────────────────────
  # Static text only. gzip_proxied stays at its default (off), so the SSE
  # stream under /api/ is never compressed or buffered on its way out.
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 5;
  # Both JS media types are listed on purpose: nginx's bundled mime.types
  # remapped .js from application/javascript to text/javascript, and matching
  # only the old name would ship the largest asset in the build uncompressed.
  gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml
    application/manifest+json
    image/svg+xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;

    # ── Timeout tuning ───────────────────────────────────────────────
    # The RAG pipeline runs multiple sequential LLM calls (HyDE →
    # step-back → rag-fusion → per-chunk generation) and can easily
    # exceed nginx's default 60 s proxy_read_timeout.
    proxy_connect_timeout 30s;
    proxy_send_timeout    600s;
    proxy_read_timeout    600s;

    # Disable buffering so the client sees partial responses / error
    # payloads as soon as the backend sends them.
    proxy_buffering off;
    proxy_request_buffering off;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  # ── Caching ────────────────────────────────────────────────────────
  # `expires` rather than `add_header Cache-Control`: an add_header in a
  # location cancels the ones inherited from the server block, which would
  # silently drop the security headers above.

  # Content-hashed by Vite — safe to cache indefinitely.
  location /assets/ {
    expires 1y;
    access_log off;
  }

  # The entry document carries the meta tags and points at the hashed
  # bundles, so it must be revalidated on every load.
  location = /index.html {
    expires -1;
  }

  location = /robots.txt {
    expires 1d;
    access_log off;
  }

  location ~ ^/sitemap.*\.xml$ {
    expires 1d;
    access_log off;
  }

  # `default_type` only fills in when the extension is absent from the mime
  # map, so this is correct whether or not the bundled map knows .webmanifest
  # — unlike a `types` block, which would replace the whole map.
  location = /site.webmanifest {
    default_type application/manifest+json;
    expires 1d;
    access_log off;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
