          <h1>Recommendica — Grounded Research Paper Recommendations &amp; Literature Search</h1>
          <p>
            Recommendica is an AI research recommendation platform powered by retrieval-augmented
            generation (RAG). Ask research questions in plain language to find peer-reviewed papers,
            grade candidate literature for genuine relevance, and read grounded responses with source citations
            and faithfulness metrics.
          </p>

        <section aria-labelledby="ns-how-it-works">
          <h2 id="ns-how-it-works">How the Research Retrieval Pipeline Works</h2>
          <ol>
            <li>
              <strong>Query Expansion &amp; Retrieval:</strong> Your question is expanded using HyDE (Hypothetical Document Embeddings), Step-Back prompting, and RAG-Fusion across batched passes.
            </li>
            <li>
              <strong>Relevance Grading:</strong> An autonomous relevance agent scores candidate papers against your inquiry, eliminating false positives and refining searches when needed.
            </li>
            <li>
              <strong>Concurrent Grounded Generation:</strong> Clustered paper chunks produce streaming responses grounded strictly in cited evidence.
            </li>
            <li>
              <strong>Citation &amp; Faithfulness Verification:</strong> Every claim is verified against source documents with precision faithfulness scoring.
            </li>
          </ol>
        </section>

        <section aria-labelledby="ns-core-features">
          <h2 id="ns-core-features">Key Capabilities</h2>
          <ul>
            <li><strong>Relevance-Graded Retrieval:</strong> Drops off-topic papers instead of returning unverified rank-ordered matches.</li>
            <li><strong>Streamed Synthesis:</strong> Concurrent chunk generation provides instantaneous reading access.</li>
            <li><strong>Transparent Sources:</strong> Complete author, summary, and DOI/arXiv attribution for every citation.</li>
            <li><strong>Hallucination Defense:</strong> The engine reports when papers are insufficient rather than hallucinating unsupported claims.</li>
          </ul>
        </section>

              Recommendica is a research recommendation engine built on retrieval-augmented generation (RAG). It expands your search queries, scans academic literature and arXiv, filters papers through a relevance scoring agent, and creates synthesized responses with verifiable source citations.
            </p>

          <article class="faq-item">
